<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Print Service</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  </script>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    body {
      margin: 0; font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #43cea2, #185a9d, #00c9ff, #92fe9d);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    form {
      background: #ffffff; border-radius: 12px; padding: 25px;
      width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; color: #2e7d32; margin-top: 0; }
    label { font-weight: bold; color: #333; font-size: 13px; display: block; margin-top: 10px; }
    input, select {
      width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;
      border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
    }
    .file-input-wrapper { margin-bottom: 15px; }
    #fileList { font-size: 12px; color: #666; margin-bottom: 10px; }
    .file-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .remove-btn { color: red; cursor: pointer; border: none; background: none; font-size: 11px; }
    button#payBtn {
      width: 100%; background: linear-gradient(90deg, #43cea2, #2e7d32);
      color: #fff; font-weight: bold; cursor: pointer; border: none;
      border-radius: 6px; padding: 12px; font-size: 15px; margin-top: 15px;
    }
    button#payBtn:disabled { background: #ccc; cursor: not-allowed; }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>

<body>
  <form id="orderForm">
    <h2>Print My Docs</h2>
    
    <label>Name</label>
    <input type="text" id="name" placeholder="Full Name" required>

    <label>Phone</label>
    <input type="text" id="phone" placeholder="Phone Number" required>

    <label>Upload PDFs (Max 5)</label>
    <input type="file" id="files" accept="application/pdf" multiple required>
    <div id="fileList"></div>

    <label>Total Pages</label>
    <input type="number" id="pages" value="0" readonly>

    <label>Print Type</label>
    <select id="printType">
      <option value="bw">Black & White (₹1.50)</option>
      <option value="color">Color (₹10.00)</option>
    </select>

    <label>Siding</label>
    <select id="sideType">
      <option value="single">Single Sided</option>
      <option value="double">Double Sided</option>
    </select>

    <label>Binding</label>
    <select id="bindingType">
      <option value="none">No Binding</option>
      <option value="spiral">Spiral Binding (+₹20)</option>
    </select>

    <label>Final Amount (INR)</label>
    <input type="text" id="amount" value="0.00" readonly>

    <button type="button" id="payBtn">Pay & Order Now</button>
  </form>

<script>
const BASE_URL = "https://student-print-backend.onrender.com";
let currentPrices = { bw: 1.5, color: 10, spiral: 20 };
let selectedFiles = [];

const filesEl = document.getElementById("files");
const pagesEl = document.getElementById("pages");
const amountEl = document.getElementById("amount");
const payBtn = document.getElementById("payBtn");

filesEl.addEventListener("change", async (e) => {
  const newFiles = Array.from(e.target.files);
  if (selectedFiles.length + newFiles.length > 5) {
    alert("Max 5 files allowed.");
    return;
  }
  selectedFiles = [...selectedFiles, ...newFiles];
  updateFileList();
  await updatePages();
});

function updateFileList() {
  const list = document.getElementById("fileList");
  list.innerHTML = selectedFiles.map((f, i) => `
    <div class="file-item">
      <span>${f.name.substring(0, 20)}...</span>
      <button class="remove-btn" onclick="removeFile(${i})">Remove</button>
    </div>
  `).join("");
}

window.removeFile = (i) => {
  selectedFiles.splice(i, 1);
  updateFileList();
  updatePages();
};

async function updatePages() {
  let total = 0;
  for (const file of selectedFiles) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
    total += pdf.numPages;
  }
  pagesEl.value = total;
  calculateTotal();
}

function calculateTotal() {
  const pages = parseInt(pagesEl.value) || 0;
  const printType = document.getElementById("printType").value;
  const sideType = document.getElementById("sideType").value;
  const binding = document.getElementById("bindingType").value;

  let sheets = (sideType === "double") ? Math.ceil(pages / 2) : pages;
  let total = sheets * currentPrices[printType];
  if (binding === "spiral" && pages > 0) total += currentPrices.spiral;
  
  amountEl.value = total.toFixed(2);
}

// Watch for changes to recalculate
document.querySelectorAll('select').forEach(el => el.addEventListener('change', calculateTotal));

payBtn.onclick = async () => {
  if (selectedFiles.length === 0) return alert("Please upload a file.");
  if (parseFloat(amountEl.value) <= 0) return alert("Amount must be greater than 0.");

  payBtn.disabled = true;
  payBtn.innerText = "Connecting to Secure Server...";

  const formData = new FormData();
  selectedFiles.forEach(f => formData.append("files", f));
  formData.append("name", document.getElementById("name").value);
  formData.append("amount", amountEl.value);

  try {
    const res = await fetch(`${BASE_URL}/order`, { method: "POST", body: formData });
    const data = await res.json();

    const options = {
      key: data.key,
      amount: data.amount * 100,
      currency: "INR",
      name: "Student Print Service",
      description: "Document Printing Order",
      order_id: data.orderId,
      handler: function(response) {
        alert("Payment Successful! Your file is sent to printing.");
        location.reload();
      },
      prefill: { contact: document.getElementById("phone").value, name: document.getElementById("name").value },
      theme: { color: "#2e7d32" }
    };

    const rzp = new Razorpay(options);
    rzp.open();
  } catch (err) {
    alert("Error creating order. Is your backend running?");
    console.error(err);
  } finally {
    payBtn.disabled = false;
    payBtn.innerText = "Pay & Order Now";
  }
};
</script>
</body>
</html>
