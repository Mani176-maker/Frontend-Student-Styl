<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f9f9f9; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 15px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #2e7d32; color: white; }
    .btn { text-decoration: none; color: #185a9d; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Order Management</h2>
  <table>
    <thead>
      <tr><th>Date</th><th>File Name</th><th>Action</th></tr>
    </thead>
    <tbody id="content"></tbody>
  </table>

  <script>
    const BASE_URL = "https://student-style.onrender.com";
    fetch(`${BASE_URL}/admin/orders`)
      .then(r => r.json())
      .then(data => {
        const html = data.map(f => `
          <tr>
            <td>${new Date(f.createdTime).toLocaleDateString()}</td>
            <td>${f.name}</td>
            <td><a href="${f.webViewLink}" target="_blank" class="btn">View File</a></td>
          </tr>`).join('');
        document.getElementById("content").innerHTML = html;
      });
  </script>
</body>
</html>
