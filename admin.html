<script>
  const BASE_URL = "https://student-style.onrender.com";
  const ADMIN_PASSWORD = "Mani@176"; 

  function checkPassword() {
    const entered = document.getElementById("passInput").value;
    if (entered === ADMIN_PASSWORD) {
      document.getElementById("login-overlay").style.display = "none";
      document.getElementById("admin-content").style.display = "block";
      loadOrders();
      
      // ✅ ADDED: Auto-refresh every 60 seconds
      setInterval(loadOrders, 60000); 
    } else {
      alert("Incorrect Password!");
    }
  }

  function loadOrders() {
    console.log("Refreshing order list...");
    fetch(`${BASE_URL}/admin/orders`)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("list");
        list.innerHTML = ""; 
        
        if (data.length === 0) {
          list.innerHTML = '<tr><td colspan="3" style="text-align:center;">No orders yet.</td></tr>';
          return;
        }

        data.forEach(file => {
          const row = `<tr>
            <td>${new Date(file.createdTime).toLocaleString()}</td>
            <td><strong>${file.name}</strong></td>
            <td><a href="${file.webViewLink}" target="_blank" class="btn">Download PDF</a></td>
          </tr>`;
          list.innerHTML += row;
        });
      })
      .catch(err => console.error("Error loading orders:", err));
  }

  function logout() { location.reload(); }
</script>
