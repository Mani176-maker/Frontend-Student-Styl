<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Order Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <h2>Place Print Order</h2>
  <form id="orderForm">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <input type="text" id="phone" placeholder="Phone Number" required><br><br>
    <input type="number" id="amount" placeholder="Amount (₹)" required><br><br>
    <select id="printType">
      <option value="Color">Color</option>
      <option value="Black & White">Black & White</option>
    </select><br><br>
    <input type="file" id="files" accept="application/pdf" required><br><br>
    <button type="button" id="payBtn" onclick="pay()">Pay Now</button>
  </form>

  <script>
    // 🔗 Replace with your actual backend Render link
    const BASE_URL = "https://your-backend-service.onrender.com";

    async function pay() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const files = document.getElementById("files").files;
      const amount = document.getElementById("amount").value;
      const printType = document.getElementById("printType").value;

      if (!name || !phone || files.length === 0) {
        alert("Please fill all details and upload a PDF.");
        return;
      }

      const payBtn = document.getElementById("payBtn");
      payBtn.innerText = "Processing Order...";
      payBtn.disabled = true;

      const formData = new FormData();
      formData.append("files", files[0]);
      formData.append("name", name);
      formData.append("phone", phone);
      formData.append("amount", amount);
      formData.append("printType", printType);

      try {
        const response = await fetch(`${BASE_URL}/order`, {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error("Server Error during upload.");
        const d = await response.json();

        const options = {
          key: "rzp_test_RwunsKPHbRYVmR", // ✅ Your Razorpay Key ID
          amount: d.amount,               // already in paise from backend
          currency: "INR",
          order_id: d.orderId,
          name: "Student Print Service",
          description: "Print Order Payment",
          handler: function(res) {
            const driveLink = `https://drive.google.com/file/d/${d.driveFileId}/view`;
            const message = `*NEW PRINT ORDER* ✅%0A%0A` +
                            `*Customer:* ${name}%0A` +
                            `*Phone:* ${phone}%0A` +
                            `*Total Paid:* ₹${amount}%0A` +
                            `*Print Type:* ${printType}%0A%0A` +
                            `*📂 PDF LINK:* ${driveLink}%0A%0A` +
                            `*Payment ID:* ${res.razorpay_payment_id}`;

            window.open(`https://wa.me/917569008169?text=${message}`, '_blank');
            payBtn.innerText = "Order Successful!";
          },
          modal: {
            ondismiss: () => {
              payBtn.innerText = "Try Again";
              payBtn.disabled = false;
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        alert("Error: " + err.message);
        payBtn.innerText = "Try Again";
        payBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
