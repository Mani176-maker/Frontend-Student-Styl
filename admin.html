<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Restricted Access</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    
    /* Login Overlay */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #2e7d32; display: flex; justify-content: center; align-items: center; z-index: 999;
    }
    .login-box { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    h3 { margin-top: 0; color: #333; }
    input[type="password"] { padding: 12px; width: 220px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; outline: none; }
    input:focus { border-color: #2e7d32; box-shadow: 0 0 5px rgba(46,125,50,0.3); }
    .login-btn { padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    .login-btn:hover { background: #1b5e20; }

    /* Dashboard UI (Hidden by default) */
    #admin-content { display: none; max-width: 950px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
    .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    h2 { color: #2e7d32; margin: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; color: #666; font-size: 14px; text-transform: uppercase; }
    .btn { display: inline-block; padding: 8px 14px; background: #185a9d; color: white; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; }
    .btn:hover { background: #12406e; }
    .logout-btn { background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h3>Admin Access</h3>
      <input type="password" id="passInput" placeholder="Enter Password" onkeypress="handleKey(event)"> <br>
      <button class="login-btn" onclick="checkPassword()">Login</button>
    </div>
  </div>

  <div id="admin-content">
    <div class="header-row">
      <h2>Recent Print Uploads</h2>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Date & Time</th>
          <th>Student/File Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="list">
        <tr><td colspan="3" style="text-align:center;">Loading orders...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const BASE_URL = "https://student-style.onrender.com";
    const ADMIN_PASSWORD = "Mani@176"; // Password updated!

    // Listen for Enter key
    function handleKey(e) {
      if (e.key === "Enter") checkPassword();
    }

    function checkPassword() {
      const entered = document.getElementById("passInput").value;
      if (entered === ADMIN_PASSWORD) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("admin-content").style.display = "block";
        loadOrders();
      } else {
        alert("Incorrect Password! Access Denied.");
        document.getElementById("passInput").value = "";
      }
    }

    function loadOrders() {
      fetch(`${BASE_URL}/admin/orders`)
        .then(res => {
          if (!res.ok) throw new Error("Could not fetch data");
          return res.json();
        })
        .then(data => {
          const list = document.getElementById("list");
          list.innerHTML = ""; 
          
          if (data.length === 0) {
            list.innerHTML = '<tr><td colspan="3" style="text-align:center;">No files found in Drive.</td></tr>';
            return;
          }

          data.forEach(file => {
            const row = `<tr>
              <td>${new Date(file.createdTime).toLocaleString()}</td>
              <td><strong>${file.name}</strong></td>
              <td><a href="${file.webViewLink}" target="_blank" class="btn">View/Download PDF</a></td>
            </tr>`;
            list.innerHTML += row;
          });
        })
        .catch(err => {
          document.getElementById("list").innerHTML = `<tr><td colspan="3" style="color:red; text-align:center;">Error: ${err.message}</td></tr>`;
        });
    }

    function logout() {
      // Simple reload clears the session/view
      location.reload();
    }
  </script>
</body>
</html>
